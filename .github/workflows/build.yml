name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # contents: write — only to publish the APK to the «latest» release below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('**/libs.versions.toml', '**/robolectric.properties') }}

      - name: Decode signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ITERMEUM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ITERMEUM_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/itermeum.jks"
          echo "ITERMEUM_KEYSTORE=$RUNNER_TEMP/itermeum.jks" >> "$GITHUB_ENV"
          echo "ITERMEUM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Room schema is committed
        # A DB version bump must ship its exported schema (section 8: every version has a migration test).
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            # Print new schema files so they can be committed from the log.
            for f in $(git status --porcelain app/schemas | awk '{print $2}'); do
              if [ -f "$f" ]; then echo "=== SCHEMA $f ==="; base64 -w0 "$f"; echo; echo "=== END ==="; fi
            done
            echo "::error::Room schema changed: commit app/schemas and add a migration"; exit 1
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK (R8)
        # Proves the minified build starts from correct keep rules; the mapping file is kept for crash traces.
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Print APK signing fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -iE "SHA-1|SHA-256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: itermeum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # A stable link that needs no GitHub login (artifact pages do), asked for by the owner:
      # https://github.com/<owner>/<repo>/releases/download/latest/itermeum.apk
      - name: Publish APK to the «latest» release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/sleepy-curie-c5lhqh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk itermeum.apk
          # GitHub's API answers 502 now and then: retry, so the link is never left empty.
          for attempt in 1 2 3 4 5; do
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            sleep 3
            if gh release create latest itermeum.apk --prerelease --target "$GITHUB_SHA" \
                --title "Iter Meum — последняя сборка" \
                --notes "Сборка ${GITHUB_SHA::7}. Ставить поверх установленного приложения — данные сохранятся."; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"; sleep $((attempt * 10))
          done
          exit 1

      - name: Upload release APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: itermeum-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
